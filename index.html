<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardForge AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Cinzel:wght@400;700&family=Bangers&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      
      /* Card Tilt Perspective */
      .card-container {
        perspective: 1000px;
      }
      
      .card-inner {
        transition: transform 0.1s ease-out;
        transform-style: preserve-3d;
      }

      /* Holographic Sheen */
      .holo-sheen {
        background: linear-gradient(
          115deg,
          transparent 0%,
          rgba(255, 255, 255, 0.05) 30%,
          rgba(255, 255, 255, 0.2) 40%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0.2) 60%,
          rgba(255, 255, 255, 0.05) 70%,
          transparent 100%
        );
        mix-blend-mode: overlay;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }

      .card-wrapper:hover .holo-sheen {
        opacity: 1;
      }
    </style>
